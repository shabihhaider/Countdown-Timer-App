# Nginx reverse proxy for Countdown Timer App (production)
# Place this file at: nginx/nginx.conf

upstream remix_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-XSS-Protection         "1; mode=block"                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Upload limit ──────────────────────────────────────────────────────────
    client_max_body_size 10M;

    # ── Shopify webhooks — no request buffering (required for HMAC signature) ──
    location /webhooks/ {
        proxy_pass              http://remix_app;
        proxy_http_version      1.1;
        proxy_set_header        Host                $host;
        proxy_set_header        X-Real-IP           $remote_addr;
        proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto   $scheme;
        proxy_request_buffering off;
        proxy_read_timeout      60s;
    }

    # ── Remix build assets — immutable, long-lived cache ──────────────────────
    location /build/ {
        proxy_pass  http://remix_app;
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── Public static files ───────────────────────────────────────────────────
    location /public/ {
        proxy_pass  http://remix_app;
        expires     7d;
        add_header  Cache-Control "public";
        access_log  off;
    }

    # ── Health check — silent ─────────────────────────────────────────────────
    location = /health {
        proxy_pass  http://remix_app;
        access_log  off;
    }

    # ── All other requests ────────────────────────────────────────────────────
    location / {
        proxy_pass              http://remix_app;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade             $http_upgrade;
        proxy_set_header        Connection          "upgrade";
        proxy_set_header        Host                $host;
        proxy_set_header        X-Real-IP           $remote_addr;
        proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto   $scheme;
        proxy_cache_bypass      $http_upgrade;

        proxy_connect_timeout   60s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;

        proxy_buffering         on;
        proxy_buffer_size       8k;
        proxy_buffers           8 8k;
    }
}

