# ─────────────────────────────────────────────────────────────────────────────
# Internal admin portal (ops subdomain) — ../admin-portal service
#
# Defense-in-depth: the portal authenticates every request itself, but keep
# this IP allowlist anyway. Replace the example CIDRs with your office/VPN
# ranges before going live, and add TLS (listen 443 ssl + certificates).
# ─────────────────────────────────────────────────────────────────────────────
upstream admin_portal {
    server portal:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # Set to your internal hostname, e.g. ops.example.com
    server_name ops.*;

    # ── IP allowlist — EDIT THESE before production ───────────────────────────
    # allow 203.0.113.0/24;   # office
    # allow 198.51.100.7;     # VPN egress
    # deny  all;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2M;

    location / {
        proxy_pass          http://admin_portal;
        proxy_http_version  1.1;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_read_timeout  60s;
    }

    location /_next/static/ {
        proxy_pass  http://admin_portal;
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }
}
