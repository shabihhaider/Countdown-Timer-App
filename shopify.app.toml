# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5a41d17e675994c5d323c4b0b8223c6d"
name = "Countdown-Timer-App"
application_url = "https://countdown-timer-app-sage.vercel.app"
embedded = true
handle = "countdown-timer-app-20"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # GDPR mandatory webhooks (required for App Store submission)
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_themes"

[auth]
redirect_urls = [
  "https://countdown-timer-app-sage.vercel.app/auth/callback",
  "https://countdown-timer-app-sage.vercel.app/auth/shopify/callback",
  "https://countdown-timer-app-sage.vercel.app/api/auth/callback"
]

[app_proxy]
url = "https://countdown-timer-app-sage.vercel.app"
subpath = "countdown"
prefix = "apps"

[pos]
embedded = false
