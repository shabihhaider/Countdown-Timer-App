# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5a41d17e675994c5d323c4b0b8223c6d"
name = "Countdown-Timer-App"
application_url = "https://countdown-timer-app-sage.vercel.app"
embedded = true
handle = "countdown-timer-app-20"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Mandatory privacy-law compliance webhooks (required for public App Store apps)
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# No admin scopes needed: theme app extension + shop metafield writes (metafieldsSet
# on Shop requires no scope) + app proxy cover all functionality.
scopes = ""

[auth]
redirect_urls = [
  "https://countdown-timer-app-sage.vercel.app/auth/callback",
  "https://countdown-timer-app-sage.vercel.app/auth/shopify/callback",
  "https://countdown-timer-app-sage.vercel.app/api/auth/callback"
]

[app_proxy]
url = "https://countdown-timer-app-sage.vercel.app"
subpath = "countdown"
prefix = "apps"

[pos]
embedded = false
