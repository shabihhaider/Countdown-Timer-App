<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Listing 6 — One app, every look</title>
<link rel="stylesheet" href="frame.css">
<style>
  .stack { position: absolute; top: 250px; left: 76px; right: 76px; display: flex; flex-direction: column; gap: 26px; }
  .barwrap { border-radius: 12px; overflow: hidden; box-shadow: 0 26px 55px -28px rgba(0,0,0,0.8); position: relative; }
  .barwrap img { width: 100%; display: block; }
  .barwrap .tag {
    position: absolute; top: 12px; right: 16px; z-index: 2;
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--green); background: rgba(11,14,13,0.6); border: 1px solid var(--green-soft);
    border-radius: 999px; padding: 5px 12px; backdrop-filter: blur(4px);
  }
  .note { position: absolute; bottom: 96px; left: 76px; right: 76px; text-align: center;
    font-size: 15px; color: var(--muted); }
  .note b { color: var(--white); font-weight: 600; }
</style></head>
<body>
  <div class="band">
    <span class="eyebrow">Fully customizable</span>
    <h1>One app, <em>every look.</em></h1>
  </div>

  <div class="stack">
    <div class="barwrap"><span class="tag">Black Friday</span><img src="bar-black.png" alt=""></div>
    <div class="barwrap"><span class="tag">Brand green</span><img src="bar-green.png" alt=""></div>
    <div class="barwrap"><span class="tag">Final hours</span><img src="bar-crimson.png" alt=""></div>
  </div>

  <div class="note"><b>Real renders — not mockups.</b> The same widget, three configurations, all built without a line of code.</div>

  <div class="wordmark"><span class="mark">⏱</span><span><b>Countdown Timer Bar</b> · Honest urgency for Shopify</span></div>
  <div class="pageno">06 / 06</div>
</body></html>
