name: countdown-timer-app

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  app-net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  # Named volumes prevent Windows-native node_modules from leaking into Linux
  # containers. Docker initialises these from the image on first run.
  node_modules:
  app_cache:

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── Remix / Vite dev server ──────────────────────────────────────────────────
  app:
    build:
      context: .
      target: development
    ports:
      - "${PORT:-3000}:3000"
      - "${HMR_SERVER_PORT:-8002}:8002"   # HMR — tunnel mode
      - "64999:64999"                      # HMR — localhost mode
    volumes:
      - .:/app                             # live source reloading
      - node_modules:/app/node_modules     # isolate Linux node_modules
      - app_cache:/app/.cache              # Vite build cache (platform-specific)
    environment:
      NODE_ENV: development
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
      SHOPIFY_APP_URL: ${SHOPIFY_APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-countdown_timer}
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-countdown_timer}
      REDIS_URL: redis://redis:6379
      PORT: ${PORT:-3000}
      FRONTEND_PORT: ${HMR_SERVER_PORT:-8002}
      HMR_SERVER_PORT: ${HMR_SERVER_PORT:-8002}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health 2>/dev/null | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - app-net
    restart: unless-stopped

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-countdown_timer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-countdown_timer}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-net
    restart: unless-stopped

  # ── Redis 7 — rate limiting, caching, future session storage ─────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net
    restart: unless-stopped

  # ── Test runner — unit (Vitest) + E2E (Playwright/Chromium) ──────────────────
  # Usage: make test              → unit + integration tests only
  #        make test:e2e          → E2E tests against the running app
  #        make test:all          → full suite (unit + E2E)
  #        make test:coverage     → unit tests with coverage report
  test:
    build:
      context: .
      target: test
    profiles: [test]
    environment:
      NODE_ENV: test
      CI: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-countdown_timer}
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-countdown_timer}
      REDIS_URL: redis://redis:6379
      APP_URL: http://app:3000
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-test_key}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-test_secret}
      SHOPIFY_APP_URL: http://app:3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
      - ./coverage:/app/coverage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - app-net

  # ── Linter / formatter — runs ESLint + Prettier in isolation ─────────────────
  # Usage: make lint   →  docker compose --profile lint run --rm lint
  lint:
    build:
      context: .
      target: all-deps
    profiles: [lint]
    command: sh -c "npm run lint && npm run format:check && npm run typecheck"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    networks:
      - app-net

  # ── Adminer — browser-based database UI ──────────────────────────────────────
  # Start with: docker compose --profile tools up
  adminer:
    image: adminer:4-standalone
    ports:
      - "${ADMINER_PORT:-8888}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: nette
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped
    profiles:
      - tools

  # ── Cloudflare Quick Tunnel — HTTPS for Shopify OAuth ────────────────────────
  # Start with: make dev-tunnel  (then copy the URL into SHOPIFY_APP_URL)
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app
    networks:
      - app-net
    restart: unless-stopped
    profiles:
      - tunnel
