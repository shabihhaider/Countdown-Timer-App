name: countdown-timer-app

# Production Docker Compose — standalone file (not an override).
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required environment variables (must be set in shell or .env.prod):
#   SHOPIFY_API_KEY, SHOPIFY_API_SECRET, SHOPIFY_APP_URL
#   POSTGRES_PASSWORD, REDIS_PASSWORD

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  app-net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data_prod:
  redis_data_prod:

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount TLS certificates here (e.g. from Certbot or your cert provider):
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - app-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Remix production server ───────────────────────────────────────────────────
  app:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: production
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:?SHOPIFY_API_KEY is required}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:?SHOPIFY_API_SECRET is required}
      SHOPIFY_APP_URL: ${SHOPIFY_APP_URL:?SHOPIFY_APP_URL is required}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-countdown_timer}}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-countdown_timer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    # Do not expose PostgreSQL port publicly in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Redis 7 ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # requirepass uses the REDIS_PASSWORD env var expanded by Compose
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    # Do not expose Redis port publicly in production
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
